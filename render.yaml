# Render Blueprint for the GeoBid backend (FastAPI + WebSockets + auction worker).
# Render: New > Blueprint > pick this repo. The frontend is deployed on Vercel.
services:
  - type: web
    name: geobid-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # The free tier's disk resets on every restart and demo auctions follow the
    # real clock, so a fresh demo dataset is seeded at each start (~30 s).
    startCommand: python -m scripts.seed_database --reset && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: GEOBID_ENVIRONMENT
        value: production
      - key: GEOBID_JWT_SECRET
        generateValue: true
      # Vercel production and preview URLs. Add exact domains to
      # GEOBID_CORS_ORIGINS (JSON list) if you use a custom domain.
      - key: GEOBID_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
